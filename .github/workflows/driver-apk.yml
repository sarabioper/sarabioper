# Builds the Android driver app (app/ + public/driver.html) and publishes the APK as the release "driver-latest".
name: Driver app (Android)
on:
  push:
    branches: [main]
    paths: ["app/**", "public/driver.html", ".github/workflows/driver-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          mkdir -p www && cp ../public/driver.html www/index.html
          npx cap add android
          node patch-android.mjs
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk ../sarabi-driver.apk
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: driver-latest
          name: Sarabi Sürücü (Android)
          body: "Приложение водителя. Установка: скачать sarabi-driver.apk на телефон и открыть. Собрано автоматически из ${{ github.sha }}."
          files: app/sarabi-driver.apk
          make_latest: true
